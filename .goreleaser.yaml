version: 2

project_name: gojev

before:
  hooks:
    - go mod tidy

builds:
  - id: gojev
    main: ./cmd/gojev
    binary: gojev
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/taigrr/gojev/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gojev
    ids:
      - gojev
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        # zip for humans; tar.gz so the npm launcher has one format on every
        # platform.
        formats: [zip, tar.gz]

# GoReleaser Pro: generate the npm launcher package + per-platform
# optional-dependency packages and publish them. Users `npm i -g @taigrr/gojev`
# (or `npx @taigrr/gojev`) and npm pulls only the binary for their platform.
npms:
  - id: gojev
    ids:
      - gojev
    name: "@taigrr/gojev"
    description: "CLI for System One decision models: Jev, Kev and Clef."
    homepage: https://github.com/taigrr/gojev
    repository: https://github.com/taigrr/gojev
    bugs: https://github.com/taigrr/gojev/issues
    license: 0BSD
    author: "Tai Groot <tai@taigrr.com>"
    keywords:
      - jev
      - kev
      - clef
      - typesafe
      - cloudflare
      - workers-ai
      - decision-model
      - system-one
      - classifier
      - cli
    access: public
    format: tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"

release:
  prerelease: auto
